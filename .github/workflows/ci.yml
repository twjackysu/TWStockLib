name: CI

on:
  workflow_dispatch:
  push:
    # release/**：維護分支（如 release/2.x）。push 事件用的是該分支自己的 ci.yml，
    # 既有的 release 分支要同步這段才會生效；之後從 master 開的 release 分支自動帶上。
    branches: [ master, main, 'release/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --logger trx
          --results-directory TestResults

      # 打包時以 Directory.Build.targets 的 package validation 比對 NuGet 上的基準版本，
      # 不小心破壞公開 API 的 PR 會在這一步失敗
      - name: Pack (API compatibility check)
        run: dotnet pack --no-build --configuration Release --output ./nupkg

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
