name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 1.1.0)'
        required: true
  push:
    tags:
      - 'v*'   # 推 v1.1.0、v2.0.0 這類 tag 才觸發

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # tag 觸發時從 tag 擷取版本號（v1.1.0 → 1.1.0）；手動觸發時使用輸入值
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PACK_ARGS="--no-build --configuration Release -p:PackageVersion=$VERSION --output ./nupkg"
          dotnet pack src/TWStockLib.Core/TWStockLib.Core.csproj $PACK_ARGS
          dotnet pack src/TWStockLib.Twse/TWStockLib.Twse.csproj $PACK_ARGS

      - name: Push to NuGet
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
